# VPS behind host nginx: prebuilt images, loopback ports, TLS handled by certbot on the host.
#   images are built on a laptop and loaded with `docker load` (see README)
#   docker compose -f deploy/docker-compose.proxied.yml up -d
services:
  backend:
    image: muara-backend:latest
    env_file: .env
    environment:
      DB_PATH: /data/muara.sqlite
      PORT: "8787"
    volumes:
      - backend-data:/data
    restart: unless-stopped
    mem_limit: 256m

  web:
    image: muara-web:proxied
    ports:
      - "127.0.0.1:3200:80"
      - "127.0.0.1:3201:8081"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 64m

volumes:
  backend-data:
