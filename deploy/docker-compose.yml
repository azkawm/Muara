# VPS stack: Caddy (TLS, static web, /api proxy) in front of the backend.
#   cp deploy/.env.example deploy/.env   # fill in
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      DB_PATH: /data/muara.sqlite
      PORT: "8787"
    volumes:
      - backend-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.muara.willian.asia/api}
        VITE_BASE_SEPOLIA_RPC_URL: ${VITE_BASE_SEPOLIA_RPC_URL:-https://sepolia.base.org}
        VITE_ARBITRUM_SEPOLIA_RPC_URL: ${VITE_ARBITRUM_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  caddy-data:
  caddy-config:
